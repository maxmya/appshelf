name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-publish even if the tag already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        run: |
          version="$(./scripts/version.sh)"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Forcing a re-publish of $tag"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released — bump the version with scripts/version.sh set X.Y.Z to cut a new one"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$tag is new — releasing"
          fi

  release:
    name: Build and publish ${{ needs.version.outputs.tag }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Fetch pinned uruntime
        run: ./target/release/appshelf --fetch-runtime

      - name: Test
        run: cargo test --locked

      - name: Build AppImage
        id: package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/build-appimage.sh dist
          echo "name=AppShelf-$VERSION-x86_64.AppImage" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the AppImage
        run: |
          ./dist/AppShelf-*-x86_64.AppImage --version
          ./dist/AppShelf-*-x86_64.AppImage --help > /dev/null

      - name: Tag the release commit
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG" -m "AppShelf $TAG"
          git push -f origin "refs/tags/$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: AppShelf ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            chmod +x ${{ steps.package.outputs.name }}
            ./${{ steps.package.outputs.name }}
            ```

            AppShelf keeps itself up to date — `--self-check-update` and
            `--self-update` work on the running AppImage, the same way it
            updates every application it manages.

            Requires `quickshell` and Omarchy's Commons components at
            `/usr/share/omarchy/shell/Commons`. Arch users can instead build the
            `PKGBUILD` in the source tree with `makepkg -si`.
          files: |
            dist/${{ steps.package.outputs.name }}
            dist/${{ steps.package.outputs.name }}.sha256
