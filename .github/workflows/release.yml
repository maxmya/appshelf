name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-publish even if the tag already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every push to main becomes a release. A commit that already carries a
      # new version in Cargo.toml releases exactly that — a deliberate minor or
      # major bump is never overridden. Otherwise the patch is walked forward
      # to the first free tag and the bump is committed back to main, so the
      # tree and the release always agree on which version this is.
      - id: resolve
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two pushes in quick succession queue behind one another, and the
          # second would otherwise resolve a version from the commit that
          # triggered it and then fail to push on top of the first one's bump.
          # Work from the branch as it stands instead.
          git fetch --tags --force origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
          version="$(./scripts/version.sh)"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forcing a re-publish of v$version"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            while git rev-parse -q --verify "refs/tags/v$major.$minor.$patch" >/dev/null; do
              patch=$((patch + 1))
            done
            version="$major.$minor.$patch"
            echo "Bumping to $version"
            ./scripts/version.sh set "$version"
            git add Cargo.toml Cargo.lock PKGBUILD
            git commit -m "Bump to $version"
            # Pushed with the default GITHUB_TOKEN, which deliberately does not
            # start another workflow run — that is what keeps this from looping.
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "v$version is new — releasing it as it stands"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish ${{ needs.version.outputs.tag }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # `resolve` may have just pushed the version bump, so take the branch as
      # it stands now rather than the commit that triggered this run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils zsync

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Fetch pinned uruntime
        run: ./target/release/appshelf --fetch-runtime

      - name: Test
        run: cargo test --locked

      - name: Build AppImage
        id: package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/build-appimage.sh dist
          echo "name=AppShelf-$VERSION-x86_64.AppImage" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the AppImage
        run: |
          ./dist/AppShelf-*-x86_64.AppImage --version
          ./dist/AppShelf-*-x86_64.AppImage --help > /dev/null

      - name: Tag the release commit
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG" -m "AppShelf $TAG"
          git push -f origin "refs/tags/$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: AppShelf ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            chmod +x ${{ steps.package.outputs.name }}
            ./${{ steps.package.outputs.name }}
            ```

            AppShelf keeps itself up to date — `--self-check-update` and
            `--self-update` work on the running AppImage, the same way it
            updates every application it manages.

            Requires `quickshell` and Omarchy's Commons components at
            `/usr/share/omarchy/shell/Commons`. Arch users can instead build the
            `PKGBUILD` in the source tree with `makepkg -si`.
          files: |
            dist/${{ steps.package.outputs.name }}
            dist/${{ steps.package.outputs.name }}.zsync
            dist/${{ steps.package.outputs.name }}.sha256
