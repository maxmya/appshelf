[package]
name = "appshelf"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Keyboard-first AppImage management for Omarchy"
repository = "https://github.com/maxmya/appshelf"

[dependencies]
anyhow = "1.0"
ksni = "0.3.6"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
shlex = "1.3"
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
url = "2.5"
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = true
