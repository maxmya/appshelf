[package]
name = "appshelf"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keyboard-first AppImage management for Omarchy"
repository = "https://github.com/maxmya/appshelf"

[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "1.3"
tempfile = "3.27"
url = "2.5"
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = true
